# Example "development" deployment bindings for institution/campus.yaml. A real deployment
# supplies its own bindings document; this one exists to show the expected shape and to let the
# definition be exercised locally.
#
# "workbench", "post-office", "library", and "registry" have real Aetheric.Provisioning
# IResourceProviders today (Redis-backed Aetheric.Provisioning.Workbench.Redis; RabbitMQ-
# management-API-backed Aetheric.Provisioning.RabbitMq; MongoDB-backed Aetheric.Provisioning.MongoDb;
# Keycloak-admin-API-backed Aetheric.Provisioning.Keycloak). archive names a provider ("s3") that
# doesn't exist yet - building it is separately roadmapped ("Demand-driven expansion" in
# docs/roadmap.md). Until it lands, ProvisioningPlanner.Plan() against this document will report
# provider.unsupported for that resource - that's expected, not a defect in this binding. The
# planner has no partial/best-effort mode, so a plan against the whole campus fails wholesale
# rather than skipping just that step; planning any subset of the other four alone works today.
#
# "workbench"'s target must match whatever target string the host's WorkbenchProvider is
# constructed with (WorkbenchProvider(string target, ...) - a fixed identity supplied by the host,
# not something this document can know in the abstract). "campus" is a placeholder.
{
  "institution": "campus",
  "version": "1.0.0",
  "deployment": {
    "name": "development"
  },
  "bindings": {
    "archive": {
      "provider": "s3"
    },
    "library": {
      "provider": "mongodb",
      "database": "campus-library"
    },
    "post-office": {
      "provider": "rabbitmq",
      "vhost": "campus"
    },
    "registry": {
      "provider": "keycloak",
      "realm": "campus"
    },
    "workbench": {
      "provider": "workbench",
      "backing": "redis",
      "target": "campus",
      "stage": "campus",
      "fallback": "none"
    }
  }
}
