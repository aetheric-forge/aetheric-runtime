# Example "development" deployment bindings for institution/campus.yaml. A real deployment
# supplies its own bindings document; this one exists to show the expected shape and to let the
# definition be exercised locally.
#
# archive/library/post-office all have real Aetheric.Provisioning IResourceProviders (S3/MinIO-
# backed Aetheric.Provisioning.S3; MongoDB-backed Aetheric.Provisioning.MongoDb; RabbitMQ-
# management-API-backed Aetheric.Provisioning.RabbitMq), and workbench has one too (Redis-backed
# Aetheric.Provisioning.Workbench.Redis). Campus is no longer the constitutional root (Article X -
# University - is; see institution/university.yaml) - registry is no longer an owned resource here
# at all. It's now bound as a parent dependency instead ("IRegistrar", below), resolved from the
# University's own registry resource (Aetheric.Provisioning.Keycloak, realm "university") via a
# live IParentCapabilityResolver check, not provisioned by this document.
#
# Whether a plan against this whole document succeeds end to end depends on how the providers are
# constructed: Workbench's backend takes a host-injected connection rather than a per-request
# credential (RedisWorkbenchBackend(IDatabase database)), so Aetheric.Provisioning.Worker's
# consumer - which builds the other three resource providers fresh per message from the request's
# RootCredentials - deliberately doesn't build a Workbench provider at all; driven through that
# Worker, a whole-campus plan still reports provider.unsupported for Workbench specifically.
# Planning archive/library/post-office together (any subset, or all three, plus IRegistrar)
# succeeds today; Workbench needs a host that composes it directly, matching how AddForgeCampus
# already wires it into aetheric-web/aetheric-admin.
#
# "workbench"'s target must match whatever target string the host's WorkbenchProvider is
# constructed with (WorkbenchProvider(string target, ...) - a fixed identity supplied by the host,
# not something this document can know in the abstract). "campus" is a placeholder.
{
  "institution": "campus",
  "version": "1.0.0",
  "deployment": {
    "name": "development"
  },
  "bindings": {
    "archive": {
      "provider": "s3",
      "bucket": "campus-archive"
    },
    "library": {
      "provider": "mongodb",
      "database": "campus-library"
    },
    "post-office": {
      "provider": "rabbitmq",
      "vhost": "campus"
    },
    "IRegistrar": {
      "source": "university.registry"
    },
    "workbench": {
      "provider": "workbench",
      "backing": "redis",
      "target": "campus",
      "stage": "campus",
      "fallback": "none"
    }
  }
}
