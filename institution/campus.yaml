# Hand-authored, not generated - Campus has no C# OfficeDefinition/IOfficePackage-style source the
# way adr-campus's Decisions institution does (that abstraction is scoped to descendant "offices",
# not the root). Validated against aetheric-provisioning's InstitutionYamlReader schema.
# YAML 1.2 (JSON flow syntax), matching adr-campus's institution definitions.
#
# Models the five Institutions Constitutional Article VI requires every Campus to maintain -
# Archive (docs/specs/archive.md), Library (docs/specs/library.md), Post Office
# (docs/specs/post.md), Registry/Registrar (docs/specs/registrar.md; the code and folder name is
# "Registry", the constitutional article calls the office "Registrar" - same name, two spellings),
# and Workbench (docs/specs/workbench.md) - plus Faculty, which campus.md doesn't mention but is a
# real runtime Institution (AethericForge.Runtime.Institutions.Faculty) with no constitutional
# article of its own yet. Note: campus.md §10 itself only lists Archive/Library/Post
# Office/Registrar; workbench.md §2 separately claims Workbench as campus-mandatory too. This
# definition follows the union of both (all five), not campus.md's incomplete list.
#
# Faculty is not resource-backed (it groups descendant Institutions under a Dean; it owns no
# external infrastructure), so unlike the other five it has a capability but no "resources" entry.
